# SPA routing for the Angular frontend (DEMO-REDESIGN — demo-day fix).
# Without this, nginx 404s on a hard-refresh of any deep client-side route
# (e.g. /solicitations/new) because there is no file at that path. try_files
# falls back to index.html so the Angular router can resolve the route.
#
# NOTE: this is the SPA-fallback fix only. The `nginx:latest` base-image pin is
# brownfield Item 11 and is intentionally left as-is.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
